server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: account-management
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

logging:
  level:
    com.zju.account: DEBUG
    org.springframework.web: INFO
